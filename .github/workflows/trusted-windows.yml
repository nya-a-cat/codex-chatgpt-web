name: Trusted Windows build

on:
  push:
    branches: ["trusted-build"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: trusted-windows-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify-build:
    runs-on: windows-2025
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          fetch-depth: 0

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.0

      - name: Apply reviewed fork hardening
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          Push-Location launcher
          bun update electron@41.10.3 --exact --ignore-scripts
          if ($LASTEXITCODE -ne 0) { throw "bun update failed" }
          Pop-Location

          $updaterPath = "launcher/electron/update.cjs"
          $content = [IO.File]::ReadAllText($updaterPath)
          $upstream = 'const REPOSITORY = "miuuyy/codex-chatgpt-web";'
          $fork = 'const REPOSITORY = "nya-a-cat/codex-chatgpt-web";'
          if ($content.Contains($upstream)) {
            $content = $content.Replace($upstream, $fork)
            [IO.File]::WriteAllText($updaterPath, $content, [Text.UTF8Encoding]::new($false))
          } elseif (-not $content.Contains($fork)) {
            throw "Updater repository declaration changed; fail closed for review"
          }

          $updateTestPath = "launcher/tests/update.test.cjs"
          $updateTest = [IO.File]::ReadAllText($updateTestPath)
          if ($updateTest.Contains("miuuyy/codex-chatgpt-web")) {
            $updateTest = $updateTest.Replace("miuuyy/codex-chatgpt-web", "nya-a-cat/codex-chatgpt-web")
            [IO.File]::WriteAllText($updateTestPath, $updateTest, [Text.UTF8Encoding]::new($false))
          } elseif (-not $updateTest.Contains("nya-a-cat/codex-chatgpt-web")) {
            throw "Updater tests no longer expose their repository trust root"
          }

          $browserPath = "launcher/electron/browser-host.cjs"
          $browser = [IO.File]::ReadAllText($browserPath)
          $lf = [string][char]10
          $crlf = ([string][char]13) + $lf
          $browserNl = if ($browser.Contains($crlf)) { $crlf } else { $lf }
          if (-not $browser.Contains("function isChatGptOrigin(value) {")) {
            $prefixNeedle = "startsWith(CHATGPT_ORIGIN)"
            $prefixCount = [regex]::Matches($browser, [regex]::Escape($prefixNeedle)).Count
            if ($prefixCount -ne 4) {
              throw "Expected four reviewed ChatGPT origin-prefix checks, found $prefixCount"
            }
            $helper = [string]::Join($browserNl, @(
              'function isChatGptOrigin(value) {',
              '  try {',
              '    return new URL(value).origin === CHATGPT_ORIGIN;',
              '  } catch {',
              '    return false;',
              '  }',
              '}',
              '',
              ''
            ))
            $browser = $browser.Replace("function allowedAuthUrl(value) {", "$helper" + "function allowedAuthUrl(value) {")
            $browser = $browser.Replace("tab.url.startsWith(CHATGPT_ORIGIN)", "isChatGptOrigin(tab.url)")
            $browser = $browser.Replace("url.startsWith(CHATGPT_ORIGIN)", "isChatGptOrigin(url)")
            $browser = $browser.Replace("current.startsWith(CHATGPT_ORIGIN)", "isChatGptOrigin(current)")
          } elseif ($browser.Contains("startsWith(CHATGPT_ORIGIN)")) {
            throw "A new ChatGPT origin-prefix check appeared after hardening"
          }
          $exportAnchor = "  isChatGptCloudflareChallengeResponse,$browserNl  isTemporaryChatUrl,"
          if (-not $browser.Contains("  isChatGptOrigin,$browserNl")) {
            if (-not $browser.Contains($exportAnchor)) { throw "Browser-host export anchor changed" }
            $browser = $browser.Replace($exportAnchor, "  isChatGptCloudflareChallengeResponse,$browserNl  isChatGptOrigin,$browserNl  isTemporaryChatUrl,")
          }
          [IO.File]::WriteAllText($browserPath, $browser, [Text.UTF8Encoding]::new($false))

          $browserTestPath = "launcher/tests/browser-host.test.cjs"
          $browserTest = [IO.File]::ReadAllText($browserTestPath)
          $testNl = if ($browserTest.Contains($crlf)) { $crlf } else { $lf }
          $importAnchor = "  isChatGptCloudflareChallengeResponse,$testNl  isTemporaryChatUrl,"
          if (-not $browserTest.Contains("  isChatGptOrigin,$testNl")) {
            if (-not $browserTest.Contains($importAnchor)) { throw "Browser-host test import anchor changed" }
            $browserTest = $browserTest.Replace($importAnchor, "  isChatGptCloudflareChallengeResponse,$testNl  isChatGptOrigin,$testNl  isTemporaryChatUrl,")
          }
          $originTestName = 'test("ChatGPT ownership requires an exact origin"'
          if (-not $browserTest.Contains($originTestName)) {
            $testMarker = 'test("smoke preserves an already-hydrated Temporary Chat page", () => {'
            if (-not $browserTest.Contains($testMarker)) { throw "Browser-host origin test insertion point changed" }
            $originTest = [string]::Join($testNl, @(
              'test("ChatGPT ownership requires an exact origin", () => {',
              '  assert.equal(isChatGptOrigin("https://chatgpt.com/?temporary-chat=true"), true);',
              '  assert.equal(isChatGptOrigin("https://chatgpt.com.evil.example/"), false);',
              '  assert.equal(isChatGptOrigin("https://chatgpt.com@evil.example/"), false);',
              '  assert.equal(isChatGptOrigin("not a url"), false);',
              '});',
              '',
              ''
            ))
            $browserTest = $browserTest.Replace($testMarker, $originTest + $testMarker)
          }
          [IO.File]::WriteAllText($browserTestPath, $browserTest, [Text.UTF8Encoding]::new($false))

          $launcher = Get-Content launcher/package.json -Raw | ConvertFrom-Json
          if ($launcher.devDependencies.electron -ne "41.10.3") {
            throw "Electron is not pinned to 41.10.3"
          }
          if ((Get-Content launcher/bun.lock -Raw) -notmatch 'electron@41\.10\.3') {
            throw "launcher/bun.lock does not resolve Electron 41.10.3"
          }

      - name: Install locked dependencies
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          bun install --frozen-lockfile --ignore-scripts
          if ($LASTEXITCODE -ne 0) { throw "root dependency install failed" }
          Push-Location launcher
          bun install --frozen-lockfile
          if ($LASTEXITCODE -ne 0) { throw "launcher dependency install failed" }
          Pop-Location

      - name: Prepare AVX2-independent Windows runtime
        shell: pwsh
        run: ./scripts/prepare-windows-baseline-bun.ps1 -Version 1.4.0 -GitHubEnv $env:GITHUB_ENV

      - name: Verify, audit, and test
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          bun run verify
          if ($LASTEXITCODE -ne 0) { throw "project verification failed" }
          Push-Location launcher
          bun audit
          if ($LASTEXITCODE -ne 0) { throw "launcher dependency audit failed" }
          Pop-Location

      - name: Package and smoke-test Windows installer
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          bun run app:package
          if ($LASTEXITCODE -ne 0) { throw "Windows packaging failed" }
          bun run app:smoke
          if ($LASTEXITCODE -ne 0) { throw "packaged launcher smoke test failed" }
          $electronVersion = (Get-Content launcher/node_modules/electron/dist/version -Raw).Trim()
          if ($electronVersion -ne "41.10.3") { throw "Packaged Electron source is $electronVersion" }

      - name: Record checksums and build provenance
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $artifacts = @(Get-ChildItem launcher/artifacts -File | Where-Object { $_.Extension -in ".exe", ".zip" } | Sort-Object Name)
          if ($artifacts.Count -eq 0) { throw "No Windows artifacts were produced" }
          $checksumLines = foreach ($artifact in $artifacts) {
            $hash = (Get-FileHash -LiteralPath $artifact.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $($artifact.Name)"
          }
          [IO.File]::WriteAllLines((Join-Path $PWD "launcher/artifacts/checksums.txt"), $checksumLines, [Text.UTF8Encoding]::new($false))
          $signatures = foreach ($artifact in $artifacts | Where-Object Extension -eq ".exe") {
            $signature = Get-AuthenticodeSignature -LiteralPath $artifact.FullName
            [ordered]@{ file = $artifact.Name; status = [string]$signature.Status }
          }
          $provenance = [ordered]@{
            repository = $env:GITHUB_REPOSITORY
            source_commit = (git rev-parse HEAD)
            workflow_run_id = $env:GITHUB_RUN_ID
            runner_image = $env:ImageVersion
            bun = (bun --version)
            electron = (Get-Content launcher/node_modules/electron/dist/version -Raw).Trim()
            signatures = @($signatures)
          } | ConvertTo-Json -Depth 5
          [IO.File]::WriteAllText((Join-Path $PWD "launcher/artifacts/build-provenance.json"), "$provenance`n", [Text.UTF8Encoding]::new($false))

      - name: Upload reviewed Windows build
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: trusted-windows-${{ github.run_id }}
          path: |
            launcher/artifacts/*.exe
            launcher/artifacts/*.zip
            launcher/artifacts/checksums.txt
            launcher/artifacts/build-provenance.json
          if-no-files-found: error
          retention-days: 30

      - name: Commit verified hardening to trusted-build
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = "Stop"
          $paths = @("launcher/package.json", "launcher/bun.lock", "launcher/electron/update.cjs", "launcher/tests/update.test.cjs", "launcher/electron/browser-host.cjs", "launcher/tests/browser-host.test.cjs")
          $changes = git status --porcelain -- @paths
          if (-not $changes) {
            Write-Output "Trusted hardening is already committed"
            exit 0
          }
          git diff --check -- @paths
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- @paths
          git commit -m "build: harden trusted Windows package [skip ci]"
          $basic = [Convert]::ToBase64String([Text.Encoding]::ASCII.GetBytes("x-access-token:$env:GH_TOKEN"))
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $basic" push origin HEAD:trusted-build